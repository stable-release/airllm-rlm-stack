[package]
name = "rlm"
version = "0.1.0"
edition = "2021"
description = "Recursive Language Model (RLM) harness in Rust: context/memory management and recursive sub-calls over a local llama.cpp (OpenAI-compatible) endpoint."
license = "MIT"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
rhai = "1"
regex = "1"
tiny_http = "0.12"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
